[package]
name = "web_preview_macos"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
agent-client-protocol.workspace = true
agent_ui.workspace = true
base64.workspace = true
acp_thread.workspace = true
editor.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
html_to_markdown.workspace = true
http_client.workspace = true
image.workspace = true
markdown.workspace = true
menu.workspace = true
paths.workspace = true
raw-window-handle = "0.6"
serde_json.workspace = true
ui.workspace = true
url.workspace = true
workspace.workspace = true
wry = { version = "0.53", features = ["devtools"] }
rust-embed.workspace = true
mime_guess.workspace = true

# The Apple-only dependencies must be target-gated, like every other
# platform-specific crate in this workspace. `cocoa`, `objc` and
# `objc2-app-kit` are used only by `macos_host`, which is itself
# `#[cfg(target_os = "macos")]`-gated, so on every other platform these
# crates are unreachable - and `objc2` carries a literal
# `compile_error!("`objc2` only works on Apple platforms")`, which made
# this one crate the only thing that could not be type-checked on a
# Windows host.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa.workspace = true
objc.workspace = true
objc2-app-kit.workspace = true
