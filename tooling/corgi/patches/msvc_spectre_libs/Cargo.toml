[package]
name = "msvc_spectre_libs"
version = "0.1.3"
edition = "2021"
description = "dx-patched msvc_spectre_libs: absent Spectre-mitigated VS libs warn instead of failing the build"
license = "MIT OR Apache-2.0"

# Kept as a no-op so dependents requesting `features = ["error"]` still
# resolve. The build script below ignores it and never panics.
[features]
error = []

[lib]
name = "msvc_spectre_libs"
path = "src/lib.rs"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.build-dependencies]
cc = "1.0"
